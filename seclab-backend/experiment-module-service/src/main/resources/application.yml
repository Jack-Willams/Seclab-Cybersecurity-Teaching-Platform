spring:
  application:
    name: experiment-module-service
  cloud:
    discovery:
      enabled: ${EXPERIMENT_MODULE_DISCOVERY_ENABLED:false}
    inetutils:
      preferred-networks: 127.0.0.1

  datasource:
    url: jdbc:mysql://${EXPERIMENT_MODULE_DB_HOST:${MYSQL_HOST:localhost}}:${EXPERIMENT_MODULE_DB_PORT:${MYSQL_PORT:3306}}/userservice?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${EXPERIMENT_MODULE_DB_USERNAME:${MYSQL_USER:seclab_app}}
    password: ${EXPERIMENT_MODULE_DB_PASSWORD:${MYSQL_PASSWORD:Seclab@123}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  jackson:
    default-property-inclusion: non_null

server:
  port: 8084
  address: 0.0.0.0

seclab:
  jwt:
    secret: ${USER_SERVICE_JWT_SECRET:SecLabUserServiceJwtSecretChangeMeAtLeast32Chars}

eureka:
  client:
    enabled: ${EXPERIMENT_MODULE_EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EXPERIMENT_MODULE_EUREKA_DEFAULT_ZONE:http://localhost:8080/eureka/}
    register-with-eureka: ${EXPERIMENT_MODULE_EUREKA_REGISTER:false}
    fetch-registry: ${EXPERIMENT_MODULE_EUREKA_FETCH:false}
  instance:
    prefer-ip-address: true
    hostname: localhost
