spring:
  application:
    name: gateway
  cloud:
    discovery:
      enabled: ${GATEWAY_DISCOVERY_ENABLED:false}
    inetutils:
      preferred-networks: 127.0.0.1
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - ${GATEWAY_CORS_ALLOWED_ORIGIN_PATTERN:*}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: user-service
          uri: ${GATEWAY_USER_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/user-service/**
          filters:
            - StripPrefix=1

server:
  port: ${GATEWAY_PORT:8085}
  address: 0.0.0.0

eureka:
  client:
    enabled: ${GATEWAY_EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${GATEWAY_EUREKA_DEFAULT_ZONE:http://localhost:8080/eureka/}
    register-with-eureka: ${GATEWAY_EUREKA_REGISTER:false}
    fetch-registry: ${GATEWAY_EUREKA_FETCH:false}
  instance:
    prefer-ip-address: true
    hostname: ${GATEWAY_HOSTNAME:localhost}
