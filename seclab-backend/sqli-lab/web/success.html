<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>挑战成功 | ByteShop SQLi Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            font-family:'Inter','Segoe UI',sans-serif;
            background:#f1f5f9;
            color:#1e293b;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
        }
        .success-container {
            max-width: 560px;
            width: 100%;
            text-align: center;
            padding: 40px 36px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,.1);
            border: 1px solid #e2e8f0;
            animation: fadeUp .5s ease;
        }
        @keyframes fadeUp{
            from{opacity:0;transform:translateY(16px)}
            to{opacity:1;transform:translateY(0)}
        }
        .success-icon { font-size: 72px; margin-bottom: 16px; }
        .success-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #065f46;
            margin-bottom: 12px;
        }
        .success-message {
            font-size: .92rem;
            color: #475569;
            line-height: 1.75;
            margin-bottom: 24px;
        }
        .flag-display {
            background: #ecfdf5;
            border: 2px solid #6ee7b7;
            padding: 14px 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-family: 'Fira Code', monospace;
            color: #059669;
            font-size: 1.05rem;
            font-weight: 600;
            word-break: break-all;
            animation: glow 2s infinite alternate;
        }
        @keyframes glow{
            from{box-shadow:0 0 8px rgba(16,185,129,.25)}
            to{box-shadow:0 0 20px rgba(16,185,129,.5)}
        }
        .score {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1d4ed8;
            font-weight: 700;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: .9rem;
            margin: 16px 0 24px;
        }
        .score-value { font-size: 1.4rem; }
        .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: .9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all .2s;
            text-decoration: none;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
            box-shadow: 0 2px 8px rgba(59,130,246,.3);
        }
        .btn-primary:hover { background: #2563eb; transform: translateY(-1px); color: white; }
        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
        }
        .btn-secondary:hover { background: #e2e8f0; }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">🏆</div>
        <h1 class="success-title">恭喜！全关通关！</h1>
        <p class="success-message">
            你已成功完成全部 SQL 注入挑战，成功绕过了登录认证并提取了隐藏 Flag。<br>
            这表明你已掌握字符型注入、UNION 联合查询和登录绕过三大核心技术！
        </p>

        <div class="flag-display">
            flag{union_sqli_pwn3d_2024}
        </div>

        <div class="score">
            <span>最终得分</span>
            <span class="score-value">100</span>
            <span>分</span>
        </div>

        <div class="actions">
            <a href="index.php" class="btn btn-primary">🔄 重新挑战</a>
            <button onclick="window.parent.postMessage({type:'lab_completed',container:'sqli-lab-web-1'},'*');window.close()"
                    class="btn btn-secondary">✓ 关闭靶机</button>
        </div>
    </div>
</body>
</html>
