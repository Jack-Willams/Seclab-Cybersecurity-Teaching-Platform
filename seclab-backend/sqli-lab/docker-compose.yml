version: "3.8"

services:
  web:
    container_name: sqli-lab-web-1
    image: sqli-lab-web:latest
    build: .
    ports:
      - "8091:80"
    volumes:
      - ./web:/var/www/html
    depends_on:
      - db
    networks:
      - sqli-net
    environment:
      - DB_HOST=db
      - DB_NAME=sqli_lab
      - DB_USER=root
      - DB_PASS=123456

  db:
    container_name: sqli-lab-db-1
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: sqli_lab
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sqli-net

volumes:
  dbdata:

networks:
  sqli-net:
