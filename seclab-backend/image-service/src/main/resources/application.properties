spring.application.name=image-service
server.port=8086

# 本服务不用数据库：ImageController 只做文件落盘和读取，没有任何实体。
# 这里原来配着写死的 root/1128 + imagedb，换台机器根本连不上，
# 全靠没有 @Entity + Hikari 懒连接才侥幸能启动。已连同 data-jpa 依赖一起去掉。

# 文件上传配置
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# 图片存储配置
image.upload-dir=uploads/images
image.max-file-size-bytes=5242880

# Eureka 配置
eureka.client.service-url.defaultZone=http://localhost:8080/eureka/
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
eureka.client.register-with-eureka=${EUREKA_REGISTER_WITH_EUREKA:false}
eureka.client.fetch-registry=${EUREKA_FETCH_REGISTRY:false}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${server.port}
