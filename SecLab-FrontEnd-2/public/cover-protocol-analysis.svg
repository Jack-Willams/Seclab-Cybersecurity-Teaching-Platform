<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="网络协议分析实验封面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091624"/>
      <stop offset="0.55" stop-color="#0b1f2e"/>
      <stop offset="1" stop-color="#0d2436"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.72" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#2ec4e6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2ec4e6" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: Consolas, "Cascadia Mono", Monaco, "Courier New", monospace; }
      .sans { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- 页眉 -->
  <rect x="56" y="52" width="150" height="4" fill="#ff2d55"/>
  <text class="mono" x="56" y="103" fill="#ffffff" font-size="22" letter-spacing="4.5">CYBER SECURITY LAB</text>
  <text class="mono" x="1544" y="88" fill="#4dc9ec" font-size="17" letter-spacing="2" text-anchor="end">CYBER RANGE / 05</text>
  <circle cx="1516" cy="120" r="5" fill="#ff2d55"/>
  <circle cx="1538" cy="120" r="5" fill="#4dc9ec"/>

  <!-- 左侧：抓包列表 -->
  <text class="mono" x="100" y="176" fill="#6d93a8" font-size="15" letter-spacing="2.5">PACKET CAPTURE</text>
  <line x1="100" y1="192" x2="700" y2="192" stroke="#24485c" stroke-width="1"/>

  <g class="mono" font-size="19">
    <rect x="155" y="216" width="465" height="78" fill="#0e2635" stroke="#1c3f55" stroke-width="1.5"/>
    <text x="181" y="252" fill="#cfe4ef">TCP</text>
    <text x="255" y="252" fill="#8fb3c4">192.168.1.101 -&gt; 10.0.0.5</text>
    <text x="594" y="252" fill="#4dc9ec" text-anchor="end">SYN</text>
    <text x="181" y="278" fill="#5a7f92" font-size="15">seq=0  win=64240  len=0</text>

    <rect x="155" y="308" width="465" height="78" fill="#0e2635" stroke="#1c3f55" stroke-width="1.5"/>
    <text x="181" y="344" fill="#cfe4ef">TCP</text>
    <text x="255" y="344" fill="#8fb3c4">10.0.0.5 -&gt; 192.168.1.101</text>
    <text x="594" y="344" fill="#4dc9ec" text-anchor="end">SYN-ACK</text>
    <text x="181" y="370" fill="#5a7f92" font-size="15">seq=0  ack=1  win=65535</text>

    <rect x="155" y="400" width="465" height="78" fill="#0e2635" stroke="#1c3f55" stroke-width="1.5"/>
    <text x="181" y="436" fill="#cfe4ef">HTTP</text>
    <text x="255" y="436" fill="#8fb3c4">GET /api/secret</text>
    <text x="594" y="436" fill="#4dc9ec" text-anchor="end">200 OK</text>
    <text x="181" y="462" fill="#5a7f92" font-size="15">Content-Type: application/json</text>

    <!-- 命中行：flag 藏在 Cookie 里，对应靶场 Level 2 -->
    <rect x="155" y="492" width="465" height="104" fill="#0d3040" stroke="#2ec4e6" stroke-width="2"/>
    <text x="181" y="528" fill="#4dc9ec" font-size="15" letter-spacing="1.5">SET-COOKIE</text>
    <text x="181" y="562" fill="#ffffff">session=</text>
    <text x="285" y="562" fill="#ff2d55">flag{...}</text>
    <text x="181" y="586" fill="#5a7f92" font-size="14">敏感信息随会话明文传输</text>
  </g>

  <line x1="100" y1="628" x2="700" y2="628" stroke="#24485c" stroke-width="1"/>
  <text class="mono" x="100" y="656" fill="#6d93a8" font-size="15" letter-spacing="2.5">SECURITY EVENT LOG</text>

  <!-- 右侧：标题 -->
  <text class="sans" x="830" y="330" fill="#ffffff" font-size="118" font-weight="700" letter-spacing="-1">PROTOCOL</text>
  <text class="sans" x="830" y="420" fill="#ff2d55" font-size="76" font-weight="700" letter-spacing="1">ANALYSIS</text>
  <line x1="830" y1="456" x2="1480" y2="456" stroke="#2ec4e6" stroke-width="2"/>
  <text class="sans" x="830" y="527" fill="#ffffff" font-size="44" font-weight="600" letter-spacing="2">网络协议分析实验</text>
  <text class="mono" x="830" y="580" fill="#6d93a8" font-size="19" letter-spacing="1.5">TCP/IP -&gt; HTTP -&gt; SECURITY EVENT</text>

  <!-- 页脚 -->
  <line x1="0" y1="752" x2="1600" y2="752" stroke="#1d4055" stroke-width="1"/>
  <text class="mono" x="56" y="806" fill="#ffffff" font-size="17" letter-spacing="2">VULNERABILITY RESEARCH / CONTROLLED ENVIRONMENT</text>
  <text class="sans" x="56" y="840" fill="#5a7f92" font-size="16" letter-spacing="1">网络空间安全实验系列 · 仅限授权教学环境</text>
  <text class="sans" x="1544" y="836" fill="#4dc9ec" font-size="56" font-weight="700" text-anchor="end">05</text>
</svg>
